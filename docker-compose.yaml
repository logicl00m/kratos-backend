services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./compose/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - kratos

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@kratos.com
      PGADMIN_DEFAULT_PASSWORD: kratos
    networks:
      - kratos
    ports:
      - "5050:80"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kratos
      KC_DB_USERNAME: kratos
      KC_DB_PASSWORD: kratos
      KC_DB_SCHEMA: keycloak
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./compose/keycloak/realms:/opt/keycloak/data/import
    networks:
      - kratos
    depends_on:
      - postgres

volumes:
  postgres_data:
  keycloak_data:

networks:
  kratos:
